# Wersje wariantu B (potok DevSecOps)
#
# WERSJA ROBOCZA: plik rośnie z zadaniami E07-02…E07-13 i zamarza w E07-14 (tag pipeline-b-v1),
# tak jak variant-a.yaml w ADR-0041. Układ pól jak w variant-a.yaml, żeby różnice A/B było widać
# w diffie (K2). Części wspólne z A (runner, uv, zależności, obrazy aplikacji, publikacja) zostaną
# przeniesione przy zamrożeniu; od E07-09 workflow B (devsecops-ci.yml) obejmuje joby lint, test i build (ADR-0050).
#
# Pola:
#   przypiete: true  – wersja wymuszona przez repozytorium (SHA, digest, suma kontrolna, lockfile)
#   przypiete: false – wersja zależna od środowiska; podana wartość to obserwacja z przebiegu kontrolnego

wariant: B
wersja: robocza  # pipeline-b-v1 w E07-14
tag: null
data_zamrozenia: null

workflow:
  - plik: .github/workflows/devsecops-ci.yml
    nazwa: devsecops-ci
    joby: [lint, test, secrets, sast, sca, iac, build, sbom, attest, verify]  # lint i test jak w A (K2); build = build A + skan Trivy przed pushem (D1); sbom na archiwum z build; attest i verify tylko na pushu (ADR-0050)
    mierzony: true
    adr: [ADR-0035, ADR-0036, ADR-0042, ADR-0044, ADR-0045, ADR-0046, ADR-0047, ADR-0048, ADR-0049, ADR-0050]
  - plik: .github/workflows/attest.yml
    nazwa: attest  # reusable workflow (workflow_call) wywoływany przez job attest; tożsamość podpisującego atestacje (A3)
    joby: [attest]
    mierzony: true  # jako część przebiegu devsecops-ci
    adr: [ADR-0050]
  - plik: .github/workflows/workflow-lint.yml
    nazwa: workflow-lint
    joby: [workflow-lint]
    mierzony: true
    adr: [ADR-0042, ADR-0043]  # do przeniesienia do workflow B w E07-14 (H8)

akcje:
  - nazwa: actions/checkout
    wersja: v7.0.1
    sha: 3d3c42e5aac5ba805825da76410c181273ba90b1
    przypiete: true
    joby: [lint, test, secrets, sast, sca, iac, build, sbom, verify, workflow-lint]
  - nazwa: actions/upload-artifact
    wersja: v7.0.2
    sha: cf430e030ddbb5b0abf93d22962f4752f3646cd9
    przypiete: true
    joby: [secrets, sast, sca, iac, build, sbom, workflow-lint]
    uwaga: w build także archiwum obrazu (image-archive, retencja 1 dzień) dla sbom (ADR-0049, S5; ADR-0050)
  - nazwa: actions/download-artifact
    wersja: v8.0.2
    sha: 9000827ccba6bdab643e8b6fd33ac0654aef8333
    przypiete: true
    joby: [sbom, attest]  # w attest pobiera SBOM do atestacji
  - nazwa: github/codeql-action/upload-sarif
    wersja: v4.39.3
    sha: 33d7b85da1a04171e211befe2c739303b9a4c066
    przypiete: true
    joby: [secrets, sast, iac, build]
    uwaga: v4.39.4 (2026-11-20) pominięta, bo nie przeszła karencji 7 dni (ADR-0043 H6, ADR-0044)
  - nazwa: actions/attest
    wersja: v4.2.2
    sha: 1e69f48acb82d1966a394da916b4c1698aa569d6
    przypiete: true
    joby: [attest]  # .github/workflows/attest.yml; dwa wywołania: provenance i SBOM (SPDX), push-to-registry, bez storage record (ADR-0050)

narzedzia:
  gitleaks:
    wersja: 8.30.1
    obraz: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    przypiete: true
    job: secrets
    reguly: domyślne  # bez .gitleaks.toml; czysta wersja bez zgłoszeń (ADR-0044, S2)
    opcje: [--redact, --ignore-gitleaks-allow, --exit-code 2]
    zakres: commity PR (base..head) albo pushu (before..after)  # ADR-0044, S1
  semgrep:
    wersja: 1.185.0
    zrodlo: PyPI, .github/tools/semgrep.txt (wszystkie zależności z hashami, pip --require-hashes)
    przypiete: true
    job: sast
    reguly:
      rejestr: p/default  # pobierany w każdym przebiegu; licencja nie pozwala go przechowywać (ADR-0045, T1, T2)
      rejestr_przypiete: false  # ślad: reports/semgrep-ruleset.json (suma kanoniczna i SHA-256 każdej reguły) w artefakcie sast-reports
      rejestr_obserwacja: {data: 2026-11-24, reguly: 1074, sha256_kanoniczna: 2989307587dddfed3601cf2a67c8ea20a98b5feb0ee72cb642f2795f88db8a52}
      wlasne: semgrep-rules/  # GT-06, GT-14; ID z prefiksem semgrep-rules.
    opcje: [--metrics=off, --disable-version-check, --disable-nosem, --exclude app/tests]
    cel: app/
    prog: wszystko poza INFO, nieznana ważność blokuje (ADR-0045, T7)
  bandit:
    wersja: 1.9.4
    zrodlo: PyPI, .github/tools/bandit.txt (bandit[sarif], PyYAML dla skryptu bramki; z hashami)
    przypiete: true
    job: sast
    opcje: [--recursive, --exclude app/tests, --ignore-nosec, --exit-zero]
    cel: app/
    prog: ważność LOW+ przy pewności MEDIUM+, nieznana pewność blokuje (ADR-0042 D5)
  pip_audit:
    wersja: 2.10.1
    zrodlo: PyPI, .github/tools/sca.txt (pip-audit, uv, PyYAML dla skryptu bramki; z hashami)
    przypiete: true
    job: sca
    baza: osv  # https://api.osv.dev/v1/query (ADR-0046, Z1)
    baza_przypiete: false  # baza zmienia się w czasie; ślad: reports/pip-audit.json w artefakcie sca-reports
    opcje: [--disable-pip, --strict, --vulnerability-service osv, --aliases on, --desc on, --format json]
    cel: app/requirements.txt  # eksport --no-dev z uv.lock (Z4)
    prog: każda znana podatność; bramka na raporcie, nie na kodzie wyjścia (ADR-0046)
    ponowienia: 3  # gdy brak raportu, przerwa 15 s (Z8)
  uv_sca:
    wersja: 0.13.6
    zrodlo: PyPI, .github/tools/sca.txt (z hashami)
    przypiete: true
    job: sca
    uzycie: uv lock --check; uv export --format requirements-txt --no-dev --frozen + diff (B11, Z5)
  python_sca:
    wersja: 3.14.10
    obraz: python:3.14-slim@sha256:22eafb370920ad8b429e0aec3fff433e0669968519f5d60469d83729c138b28b
    przypiete: true
    job: [sca, build, sbom]  # Python aplikacji (Z3); w build i sbom tylko dla skryptu bramki i kontroli SBOM
  python_runnera:
    wersja: 3.12  # python3 obrazu ubuntu-24.04; w teście lokalnym 3.12.16
    przypiete: false
    job: [sast, iac]
  checkov:
    wersja: 3.4.5
    zrodlo: PyPI, .github/tools/iac.txt (checkov, PyYAML dla skryptu bramki; 96 pakietów z hashami)
    przypiete: true
    job: iac
    reguly: wbudowane w wersję  # bez platformy Prisma Cloud (--skip-download), bez ważności
    opcje: [-d infra/terraform, -d app, --framework terraform dockerfile, --skip-download, --skip-results-upload, -o json, -o sarif]
    cel: [infra/terraform/work, infra/terraform/shared, app/Dockerfile]  # ADR-0047, I1
    prog: każda nieudana kontrola, także #checkov:skip (D5, D13)
  trivy_config:
    wersja: 0.76.2
    obraz: ghcr.io/aquasecurity/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    przypiete: true
    job: iac
    reguly: wbudowane w binarkę (--skip-check-update, decyzja autora z 2026-11-16)
    opcje: [config, --skip-check-update, --skip-version-check, --config "", --ignorefile ""]
    cel: kopia śledzonych plików infra/terraform i app/Dockerfile ze ścieżkami repozytorium (ADR-0047)
    prog: LOW i wyżej (D5a); komentarz trivy:ignore blokuje (I3)
  trivy_image:
    wersja: 0.76.2
    obraz: ghcr.io/aquasecurity/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    przypiete: true
    job: build  # skan obrazu w build przed docker push (D1, ADR-0050)
    baza: ghcr.io/aquasecurity/trivy-db@sha256:78c9bebc838106b10b9ad320b9d7976319ca7516740dd0fe01a5b5036b6049e1
    baza_przypiete: true  # UpdatedAt 2026-11-25T07:11:44Z; zmiana tylko świadomie, z przeglądem wyjątków (ADR-0048, M3, M3a)
    opcje: [image, --input, --skip-db-update, --scanners vuln,secret, --image-config-scanners secret, --config "", --ignorefile "", --secret-config "", --disable-telemetry, --format json]
    sarif: trivy convert z raportu JSON
    cel: archiwum docker save obrazu zbudowanego z app/ (ADR-0048, M5)
    prog: podatności MEDIUM+ ze statusem fixed (D5a), każdy sekret (M4); bramka .github/scripts/image_gate.py
  pyyaml_image_gate:
    wersja: 6.0.3
    zrodlo: PyPI, .github/tools/image.txt (z hashami)
    przypiete: true
    job: build  # skan obrazu w build przed docker push (D1, ADR-0050)
  syft:
    wersja: 1.57.2
    obraz: anchore/syft:v1.57.2@sha256:e97e20b6e6d1699c60296b66ab337941724f9bd06ac279d893eda89601fc4b2a
    przypiete: true
    job: sbom
    opcje: [docker-archive:, --source-name ghcr.io/<repozytorium>, --output spdx-json, --output cyclonedx-json, --quiet]  # SYFT_CHECK_FOR_APP_UPDATE=false
    cel: archiwum docker save z build (artefakt image-archive, ADR-0049, S5; ADR-0050)
    formaty: {spdx: SPDX-2.3, cyclonedx: "1.7"}  # sprawdzane przez .github/scripts/sbom_check.py (S3)
    katalogery: domyślne dla obrazu (image, file)
    prog: brak; fail closed (błąd Syft, brak pliku, inna wersja schematu, brak pakietów deb albo pypi, inny commit)
  hadolint:
    wersja: 2.15.1
    obraz: ghcr.io/hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
    przypiete: true
    job: iac
    opcje: [--disable-ignore-pragma, --no-fail]
    cel: app/Dockerfile
    prog: poziom error (D7)
  gh:
    wersja: 2.105.0
    zrodlo: tarball gh_2.105.0_linux_amd64.tar.gz z wydania cli/cli, SHA-256 79e7ab5db738c48777b696e374f8b428f0647debfb424f44d2f426370407fe2f
    przypiete: true
    job: verify  # oraz agent wdrożenia na instancji wariantu B (user-data.sh, ta sama wersja i suma)
    uzycie: infra/terraform/work/verify-attestation.sh -> gh attestation verify --bundle-from-oci --repo --signer-workflow attest.yml --source-ref --deny-self-hosted-runners (ADR-0050)
    kody: {0: zweryfikowana, 10: brak atestacji (czekaj), 11: odrzucona, 1: błąd (ponów)}
  actionlint:
    wersja: 1.7.12
    obraz: rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    przypiete: true
    job: workflow-lint
  zizmor:
    wersja: 1.32.0
    obraz: ghcr.io/zizmorcore/zizmor@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d
    przypiete: true
    job: workflow-lint
    opcje: [--persona regular, --min-severity low]  # tryb online z tokenem joba (ADR-0043)

# Kontrole poza potokiem i poza pomiarem (ADR-0042, sekcja 4.4).
poza_pomiarem:
  - nazwa: hook pre-commit gitleaks
    plik: .pre-commit-config.yaml
    wersja: 8.30.1
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # commit tagu v8.30.1
    tryb: doradczo  # B01, ADR-0044 S5
  - nazwa: Dependabot alerts i security updates
    plik: .github/dependabot.yml  # aktualizacje wersji; alerty i security updates w settings.sh
    tryb: ustawienie platformy  # B04, ADR-0043 H6; stan potwierdzony 2026-11-24 (ADR-0046)

# Wyjątki czystej wersji (D6): lista zamarza z progami (K5).
wyjatki:
  plik: .github/gate-exceptions.yaml  # wspólny dla bramek (ADR-0045, T8)
  gitleaks: []  # brak, mechanizm .gitleaks.toml (2026-11-24, ADR-0044)
  sca: []  # czysta wersja bez zgłoszeń pip-audit (2026-11-24, ADR-0046)
  iac:  # czysta wersja, 2026-11-24 (ADR-0047, I2): 22 wpisy, 23 trafienia (AWS-0104 dwa razy w jednym pliku)
    trivy_config:
      - {regula: AWS-0132, plik: infra/terraform/shared/state.tf}
      - {regula: AWS-0132, plik: infra/terraform/work/storage.tf}
      - {regula: AWS-0089, plik: infra/terraform/shared/state.tf}
      - {regula: AWS-0089, plik: infra/terraform/work/storage.tf}
      - {regula: AWS-0090, plik: infra/terraform/work/storage.tf}
      - {regula: AWS-0178, plik: infra/terraform/work/network.tf}
      - {regula: AWS-0104, plik: infra/terraform/work/security.tf}
    checkov:
      - {regula: CKV_AWS_145, plik: infra/terraform/shared/state.tf}
      - {regula: CKV_AWS_145, plik: infra/terraform/work/storage.tf}
      - {regula: CKV_AWS_18, plik: infra/terraform/shared/state.tf}
      - {regula: CKV_AWS_18, plik: infra/terraform/work/storage.tf}
      - {regula: CKV_AWS_21, plik: infra/terraform/work/storage.tf}
      - {regula: CKV2_AWS_11, plik: infra/terraform/work/network.tf}
      - {regula: CKV_AWS_144, plik: infra/terraform/shared/state.tf}
      - {regula: CKV_AWS_144, plik: infra/terraform/work/storage.tf}
      - {regula: CKV2_AWS_62, plik: infra/terraform/shared/state.tf}
      - {regula: CKV2_AWS_62, plik: infra/terraform/work/storage.tf}
      - {regula: CKV2_AWS_61, plik: infra/terraform/work/storage.tf}
      - {regula: CKV_AWS_88, plik: infra/terraform/work/ec2.tf}
      - {regula: CKV_AWS_126, plik: infra/terraform/work/ec2.tf}
      - {regula: CKV_AWS_260, plik: infra/terraform/work/security.tf}
      - {regula: CKV_AWS_297, plik: infra/terraform/work/cleanup.tf}
    hadolint: []
  image:  # czysta wersja, baza z 2026-11-25 (ADR-0048, M2): 16 CVE, 29 wpisów pakietów
    trivy_image:
      - {regula: CVE-2026-18374, pakiet: debian/glibc, waznosc: MEDIUM}
      - {regula: CVE-2026-19499, pakiet: debian/glibc, waznosc: MEDIUM}
      - {regula: CVE-2026-19542, pakiet: debian/glibc, waznosc: MEDIUM}
      - {regula: CVE-2026-5435, pakiet: debian/glibc, waznosc: MEDIUM}
      - {regula: CVE-2026-6238, pakiet: debian/glibc, waznosc: MEDIUM}
      - {regula: CVE-2026-6368, pakiet: debian/glibc, waznosc: MEDIUM}
      - {regula: CVE-2026-6791, pakiet: debian/glibc, waznosc: MEDIUM}
      - {regula: CVE-2026-77117, pakiet: debian/glibc, waznosc: MEDIUM}
      - {regula: CVE-2026-80489, pakiet: debian/glibc, waznosc: MEDIUM}
      - {regula: CVE-2026-8674, pakiet: debian/glibc, waznosc: MEDIUM}
      - {regula: CVE-2026-86805, pakiet: debian/glibc, waznosc: MEDIUM}
      - {regula: CVE-2026-89092, pakiet: debian/glibc, waznosc: MEDIUM}
      - {regula: CVE-2026-95818, pakiet: debian/glibc, waznosc: MEDIUM}
      - {regula: CVE-2026-124851, pakiet: debian/libzstd, waznosc: HIGH}
      - {regula: CVE-2026-27171, pakiet: debian/zlib, waznosc: MEDIUM}
      - {regula: CVE-2026-85091, pakiet: debian/zlib, waznosc: HIGH}
  sast:  # czysta wersja, 2026-11-24 (ADR-0045)
    - {narzedzie: bandit, regula: B108, plik: app/ticketing/config.py}
    - {narzedzie: semgrep, regula: package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown, plik: app/pyproject.toml}
    - {narzedzie: semgrep, regula: python.django.security.django-no-csrf-token.django-no-csrf-token, plik: app/ticketing/templates/login.html}
