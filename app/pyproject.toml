[project]
name = "ticketing"
version = "0.1.0"
description = "Research web application for the DevSecOps pipeline experiment (team ticket system)"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.122",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[tool.uv]
# Application, not a library: no build backend, run from this directory.
package = false
# Same resolver everywhere (local, CI, Docker); see docs/adr/0008-menedzer-zaleznosci-uv.md.
required-version = "==0.13.6"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "moto[s3]>=5.2.5",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The app is not installed as a package (tool.uv.package = false).
pythonpath = ["."]
addopts = ["--strict-markers", "--cov", "--cov-report=term-missing"]
# A clean run has no warnings (docs/adr/0013-klient-http-testow-httpx2.md).
filterwarnings = ["error"]

[tool.ruff]
# Below requires-python on purpose: with py314 the formatter rewrites
# `except (A, B):` to the PEP 758 form `except A, B:`, which SAST parsers may not
# support yet, and pyupgrade unquotes SQLAlchemy forward references (UP037).
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Style and correctness only. No security rules (S, flake8-bandit): lint runs in
# both pipeline variants, and variant A has no security controls
# (experiment/PROTOCOL.md). Security analysis belongs to the scanners in variant B.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.coverage.run]
source = ["ticketing"]
branch = true

[tool.coverage.report]
# Minimum from the task definition (E04-03); the tests run in both pipeline variants.
fail_under = 70
