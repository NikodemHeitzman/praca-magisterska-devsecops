# Local and CI runtime of the application: app (Dockerfile), PostgreSQL and moto
# (docs/adr/0023-uruchamianie-stosu-docker-compose.md).
# Images pinned by digest (AGENTS.md, rule 6); values come from app/.env (see .env.example).
#
# `docker compose up -d --build` starts everything in order: db and s3, then the one-off
# services migrate (alembic upgrade head) and seed (accounts, tickets, attachment), then app.
# Development on the host (uv run uvicorn) needs only `docker compose up -d db s3`.
name: ticketing

# Shared by app, migrate and seed: one image, one configuration. Every service that uses the
# image builds it, so `up --build` never tries to pull ticketing:local from a registry.
x-ticketing: &ticketing
  build: .
  image: ticketing:local
  env_file: .env
  # Container-side addresses override the host-side ones from .env.
  environment:
    DATABASE_URL: postgresql+psycopg://ticketing:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in app/.env}@db:5432/ticketing
    S3_ENDPOINT_URL: http://s3:5000
    # Source tree is read-only for the app user; the cache lives in /tmp.
    ATTACHMENT_CACHE_DIR: /tmp/ticketing-attachments

services:
  app:
    <<: *ticketing
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully

  # Migrations stay outside the image and the app process (ADR-0022); here they run once per `up`.
  migrate:
    <<: *ticketing
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # Idempotent (ticketing/seed.py): re-running it on every `up` also restores the bucket and
  # the attachment object that moto loses on restart.
  seed:
    <<: *ticketing
    command: ["python", "-m", "ticketing.seed"]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3:
        condition: service_healthy

  db:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in app/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible stand-in for local runs and CI (docs/adr/0009-lokalna-usluga-s3-moto.md).
  # In-memory: buckets and objects are lost on restart; the seed service recreates them.
  s3:
    image: motoserver/moto:5.2.5@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:5000/moto-api/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
