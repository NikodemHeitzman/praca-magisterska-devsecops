# Local and CI runtime dependencies of the application.
# The app service is added together with the Dockerfile (E05-01).
# Images pinned by digest (AGENTS.md, rule 6); values come from app/.env (see .env.example).
name: ticketing

services:
  db:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in app/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible stand-in for local runs and CI (docs/adr/0009-lokalna-usluga-s3-moto.md).
  # In-memory: buckets and objects are lost on restart; the seed script recreates them.
  s3:
    image: motoserver/moto:5.2.5@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
    ports:
      - "127.0.0.1:5000:5000"

volumes:
  db-data:
