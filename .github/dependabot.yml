# Dependabot version updates (docs/projekt-potoku.md B04; docs/adr/0043-utwardzenie-workflowow.md, H6).
# Scope: what ends up in the deployed image or runs the pipeline. Terraform providers stay out:
# the infrastructure is ephemeral and not part of the artefact.
# No version updates for Python (app/): Dependabot changed only requirements.txt and left uv.lock
# behind (PRs #13, #15). Python dependencies are updated by hand with `uv lock --upgrade-package`
# and a fresh `uv export`; Dependabot alerts still report vulnerable versions (ADR-0043).
#
# - cooldown: a new release waits 7 days before Dependabot proposes it, which leaves time for a
#   hijacked release to be noticed (tj-actions 2025, trivy-action 2026). Security updates are
#   not delayed: cooldown applies to version updates only.
# - one grouped PR per ecosystem per week: a single author reviews every update.
# - updates target main; the experiment branches exp/variant-* are never updated.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # Base images in app/Dockerfile (pinned by tag and digest).
  # The uv image is ignored: its version must match UV_VERSION and UV_CHECKSUM in the workflows,
  # and variant A is frozen (pipeline-a-v1, ADR-0041). uv is updated by hand in all places at once.
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: astral-sh/uv # name used in Dependabot PR #14
      - dependency-name: ghcr.io/astral-sh/uv
    groups:
      docker:
        patterns: ["*"]
