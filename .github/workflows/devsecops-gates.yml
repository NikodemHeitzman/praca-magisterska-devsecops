# DevSecOps gates (variant B, docs/projekt-potoku.md; decisions: docs/adr/0042-projekt-potoku-wariantu-b.md,
# docs/adr/0044-skanowanie-sekretow.md).
#
# One shared file for the variant B gates that do not need the image (S4). E07-04...E07-06 add
# their jobs here; E07-14 merges this file with the shared jobs (lint, test, build) into the
# variant B workflow. A copy of the shared jobs here would publish the image twice (H8).
# No path filter: the gate jobs are required checks in the rulesets.
#
# Tools run from official images pinned by digest, not from actions (ADR-0042, D9). Each tool
# first writes a full report (uploaded as an artifact for M1), then a separate step applies the
# gate on that report (fail closed: a missing or unreadable report fails the gate).
name: devsecops-gates

on:
  pull_request:
    branches: [main, "exp/variant-*"]
  push:
    branches: [main, "exp/variant-*"]

permissions: {}

# One run per ref at a time; queued, not cancelled, so no run is lost from the timing data.
concurrency:
  group: devsecops-gates-${{ github.ref }}
  cancel-in-progress: false

env:
  # Gitleaks 8.30.1 (same digest on ghcr.io and Docker Hub, multi-arch index)
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  # B07: secrets in the commits of this pull request or push (S1). Default Gitleaks rules;
  # exceptions only in .gitleaks.toml under D6 (S2). Gitleaks has no severity levels, so any
  # finding fails the gate. `gitleaks:allow` comments are ignored (D13).
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload-sarif (S3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commit range needs both ends and the default branch
          persist-credentials: false

      # Pull request: commits of the PR (base..head). Push: commits of the push (before..after);
      # a new branch has no "before", so its commits are those not on the default branch.
      # Same idea as gitleaks-action (commit range via --log-opts). A range whose ends are missing
      # (e.g. after a force push) fails here, before the scan.
      - name: Commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              range="$PR_BASE..$PR_HEAD" ;;
            push)
              if [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                range="origin/$DEFAULT_BRANCH..$PUSH_AFTER"
              else
                range="$PUSH_BEFORE..$PUSH_AFTER"
              fi ;;
            *)
              echo "::error::unsupported event $EVENT_NAME"; exit 1 ;;
          esac
          count=$(git rev-list --count "$range")
          echo "Scanning $count commit(s): $range"
          echo "range=$range" >>"$GITHUB_OUTPUT"

      - name: Pull tool image
        run: docker pull --quiet "$GITLEAKS_IMAGE"

      # Exit code 2 means findings and is expected here; 1 is a tool error and fails.
      # --redact: reports are artifacts of a public repository, so values never leave the scan.
      - name: Gitleaks reports (JSON for M1, SARIF for code scanning)
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          mkdir -p reports
          for format in json sarif; do
            docker run --rm -v "$PWD:/repo:ro" -v "$PWD/reports:/reports" "$GITLEAKS_IMAGE" \
              git /repo --log-opts="$RANGE" --redact --ignore-gitleaks-allow --no-banner \
              --exit-code 2 --report-format "$format" --report-path "/reports/gitleaks.$format" \
              || [ $? -eq 2 ]
          done

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secrets-reports
          path: reports/
          if-no-files-found: error
          retention-days: 90

      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('reports/gitleaks.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/gitleaks.sarif
          category: gitleaks

      - name: Gate - Gitleaks (any finding)
        run: |
          findings=$(jq 'length' reports/gitleaks.json)
          echo "Gitleaks findings: $findings"
          if [ "$findings" -ne 0 ]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::\(.RuleID) in commit \(.Commit[0:12])"' \
              reports/gitleaks.json
            exit 1
          fi
