# TEMPORARY (E05-07): publishes the app image for the end-to-end test of the pull-model
# deployment (docs/adr/0033-mechanizm-wdrozenia-pull.md). Delete it after the test; the real
# publication is the build job of the pipelines (E06-02). Same idea as the OIDC test workflow
# in E05-06: the evidence stays in git history, not in the compared pipelines.
name: e2e-publish

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Variant branch whose tag the image gets (the deploy agent follows it)
        type: choice
        options:
          - exp/variant-a
          - exp/variant-b
      marker:
        description: Free text baked into a label, so that two test images differ
        type: string
        default: "1"

permissions: {}

concurrency:
  group: deploy-tag-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and push
        env:
          BRANCH: ${{ inputs.branch }}
          MARKER: ${{ inputs.marker }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          tag=${BRANCH//\//-}
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "devsecops-thesis.e2e-marker=$MARKER" \
            --tag "$image:sha-$GITHUB_SHA" --tag "$image:$tag" app/
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:$tag"
          digest=$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$image:$tag")
          docker logout ghcr.io
          {
            echo "### Published"
            echo "- \`$image:$tag\` -> \`${digest#*@}\`"
            echo "- revision \`$GITHUB_SHA\`, marker \`$MARKER\`"
          } >>"$GITHUB_STEP_SUMMARY"
