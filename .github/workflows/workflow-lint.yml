# Workflow lint (variant B, docs/projekt-potoku.md B16, B17; docs/adr/0043-utwardzenie-workflowow.md):
# actionlint and zizmor check every workflow file and the Dependabot configuration.
#
# A separate file until E07-14 moves the job into the variant B workflow: a copy of the shared
# jobs (lint, test, build) here would publish the image twice on every push to main (H8).
# No path filter: `workflow-lint` is a required check in the rulesets, and a skipped workflow
# would leave it pending forever.
#
# Tools run from official images pinned by digest, not from actions (ADR-0042, D9). Each tool
# first writes a full report (all severities, uploaded as an artifact for M1), then a separate
# step applies the gate (fail closed):
# - actionlint: any finding fails;
# - zizmor, default persona (H10): any finding above informational fails (D5).
name: workflow-lint

on:
  pull_request:
    branches: [main, "exp/variant-*"]
  push:
    branches: [main, "exp/variant-*"]

permissions: {}

env:
  # actionlint 1.7.12 (same image as the freeze check in experiment/versions/variant-a.yaml)
  ACTIONLINT_IMAGE: rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  # zizmor 1.32.0
  ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull tool images
        run: |
          docker pull --quiet "$ACTIONLINT_IMAGE"
          docker pull --quiet "$ZIZMOR_IMAGE"

      # Exit code 1 means findings and is expected here; 2 and 3 are tool errors and fail.
      - name: actionlint report
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" \
            -format '{{json .}}' >reports/actionlint.json || [ $? -eq 1 ]

      # Online mode with the read-only job token: zizmor also checks that pinned SHAs exist
      # upstream and that pinned action versions have no known advisories.
      - name: zizmor report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GH_TOKEN -v "$PWD:/repo:ro" "$ZIZMOR_IMAGE" \
            --persona regular --format json --no-exit-codes /repo >reports/zizmor.json

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-lint-reports
          path: reports/
          if-no-files-found: error
          retention-days: 90

      - name: Gate - actionlint (any finding)
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -color

      - name: Gate - zizmor (above informational)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GH_TOKEN -v "$PWD:/repo:ro" "$ZIZMOR_IMAGE" \
            --persona regular --min-severity low --format github /repo
