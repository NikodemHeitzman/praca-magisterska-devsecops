# DevSecOps CI (variant B, docs/projekt-potoku.md; decisions: docs/adr/0042-projekt-potoku-wariantu-b.md,
# docs/adr/0050-atestacje-i-weryfikacja-przed-wdrozeniem.md).
#
# Variant A (baseline-ci.yml, frozen in the tag pipeline-a-v1, ADR-0041) plus the security
# controls. One workflow for the whole variant (ADR-0050, A1, B1), so the image that the gates
# scan, the SBOM, the attestations and the deployment refer to one digest:
# - lint, test: the jobs of variant A without any change (K2),
# - secrets, sast, sca, iac: gates on the repository (ADR-0044...ADR-0047),
# - build: the build of variant A, with the Trivy image scan between docker build and docker
#   push (ADR-0042, D1; ADR-0048); the gate blocks the push,
# - sbom: Syft on the archive of the same image (ADR-0049),
# - attest (push only): provenance and SBOM attestations from the reusable attest.yml, after
#   all gates of the run (D3); verify (push only): the check the instance runs (B3).
# workflow-lint.yml stays a separate workflow until variant B is frozen (ADR-0043, H8).
# No path filter: the jobs are required checks in the rulesets.
#
# Tools run from official images pinned by digest, not from actions (ADR-0042, D9). Each tool
# first writes a full report (uploaded as an artifact for M1), then a separate step applies the
# gate on that report (fail closed: a missing or unreadable report fails the gate).
name: devsecops-ci

on:
  pull_request:
    branches: [main, "exp/variant-*"]
  push:
    branches: [main, "exp/variant-*"]

permissions: {}

# One run per ref at a time; queued, not cancelled, so no run is lost from the timing data.
concurrency:
  group: devsecops-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.6"
  # sha256 of uv-x86_64-unknown-linux-gnu.tar.gz 0.13.6 (GitHub release asset)
  UV_CHECKSUM: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645
  # Gitleaks 8.30.1 (same digest on ghcr.io and Docker Hub, multi-arch index)
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  # Semgrep registry ruleset (T1). Fetched per run; only its SHA-256 and rule ids are kept (T2).
  SEMGREP_RULESET: p/default
  # Python 3.14.10 slim (multi-arch index): the Python of the application, for the sca tools (Z3)
  PYTHON_IMAGE: python:3.14-slim@sha256:22eafb370920ad8b429e0aec3fff433e0669968519f5d60469d83729c138b28b
  # Trivy 0.76.2 (same digest on ghcr.io and Docker Hub, multi-arch index); checks built into the binary
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  # Trivy vulnerability database pinned by digest (ADR-0048, M3): UpdatedAt 2026-11-25T07:11:44Z.
  # Changed on purpose only, together with a review of the trivy-image exceptions.
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db@sha256:78c9bebc838106b10b9ad320b9d7976319ca7516740dd0fe01a5b5036b6049e1
  # hadolint 2.15.1 (same digest on ghcr.io and Docker Hub, multi-arch index)
  HADOLINT_IMAGE: ghcr.io/hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  # Syft 1.57.2 (Docker Hub, multi-arch index)
  SYFT_IMAGE: anchore/syft:v1.57.2@sha256:e97e20b6e6d1699c60296b66ab337941724f9bd06ac279d893eda89601fc4b2a
  # GitHub CLI for the verify job: the same version and tarball as on the instance
  # (infra/terraform/work/user-data.sh, GH_VERSION and GH_SHA256; ADR-0050).
  GH_VERSION: "2.105.0"
  GH_SHA256: 79e7ab5db738c48777b696e374f8b428f0647debfb424f44d2f426370407fe2f

jobs:
  # Shared with variant A (baseline-ci.yml at pipeline-a-v1), unchanged (K2).
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          working-directory: app
          enable-cache: "false"

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .

      - name: ruff format
        run: uv run --no-sync ruff format --check .

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          working-directory: app
          enable-cache: "false"

      - name: Generate app/.env with random secrets
        run: sh scripts/ci-env.sh

      - name: Start PostgreSQL
        run: docker compose up -d --wait db

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: pytest
        run: uv run --no-sync pytest

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down --volumes


  # B07: secrets in the commits of this pull request or push (S1). Default Gitleaks rules;
  # exceptions only in .gitleaks.toml under D6 (S2). Gitleaks has no severity levels, so any
  # finding fails the gate. `gitleaks:allow` comments are ignored (D13).
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload-sarif (S3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commit range needs both ends and the default branch
          persist-credentials: false

      # Pull request: commits of the PR (base..head). Push: commits of the push (before..after);
      # a new branch has no "before", so its commits are those not on the default branch.
      # Same idea as gitleaks-action (commit range via --log-opts). A range whose ends are missing
      # (e.g. after a force push) fails here, before the scan.
      - name: Commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              range="$PR_BASE..$PR_HEAD" ;;
            push)
              if [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                range="origin/$DEFAULT_BRANCH..$PUSH_AFTER"
              else
                range="$PUSH_BEFORE..$PUSH_AFTER"
              fi ;;
            *)
              echo "::error::unsupported event $EVENT_NAME"; exit 1 ;;
          esac
          count=$(git rev-list --count "$range")
          echo "Scanning $count commit(s): $range"
          echo "range=$range" >>"$GITHUB_OUTPUT"

      - name: Pull tool image
        run: docker pull --quiet "$GITLEAKS_IMAGE"

      # Exit code 2 means findings and is expected here; 1 is a tool error and fails.
      # --redact: reports are artifacts of a public repository, so values never leave the scan.
      - name: Gitleaks reports (JSON for M1, SARIF for code scanning)
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          mkdir -p reports
          for format in json sarif; do
            docker run --rm -v "$PWD:/repo:ro" -v "$PWD/reports:/reports" "$GITLEAKS_IMAGE" \
              git /repo --log-opts="$RANGE" --redact --ignore-gitleaks-allow --no-banner \
              --exit-code 2 --report-format "$format" --report-path "/reports/gitleaks.$format" \
              || [ $? -eq 2 ]
          done

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secrets-reports
          path: reports/
          if-no-files-found: error
          retention-days: 90

      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('reports/gitleaks.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/gitleaks.sarif
          category: gitleaks

      - name: Gate - Gitleaks (any finding)
        run: |
          findings=$(jq 'length' reports/gitleaks.json)
          echo "Gitleaks findings: $findings"
          if [ "$findings" -ne 0 ]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::\(.RuleID) in commit \(.Commit[0:12])"' \
              reports/gitleaks.json
            exit 1
          fi

  # B08, B09: SAST on the application code (ADR-0045). Semgrep with the registry ruleset (T1)
  # and the custom rules for GT-06 and GT-14; Bandit. Scope: app/ without app/tests/ (T3);
  # semgrep-rules/ holds intentionally vulnerable test files and is never a target.
  # Tools from PyPI, exact versions with hashes (D9). In-code suppressions are disabled (D13).
  sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload-sarif
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools (hash-checked)
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --quiet --no-deps --require-hashes -r .github/tools/semgrep.txt
          python3 -m venv "$RUNNER_TEMP/bandit"
          "$RUNNER_TEMP/bandit/bin/pip" install --quiet --no-deps --require-hashes -r .github/tools/bandit.txt
          "$RUNNER_TEMP/semgrep/bin/semgrep" --version
          "$RUNNER_TEMP/bandit/bin/bandit" --version

      # The registry ruleset is not stored: its license forbids redistribution (T2). The run keeps
      # hashes and rule ids, so the analysis can tell whether the ruleset changed in a series.
      # The served bytes differ between runs with the same rules (CDN, PR #22 vs #23), so the
      # comparison uses a canonical hash: one SHA-256 per parsed rule (keys sorted) and one over
      # all of them. The raw file hash is kept for reference only.
      - name: Fetch Semgrep registry ruleset
        run: |
          mkdir -p reports
          curl --fail --silent --show-error --location --retry 3 \
            "https://semgrep.dev/c/$SEMGREP_RULESET" -o registry-ruleset.yaml
          "$RUNNER_TEMP/bandit/bin/python" - registry-ruleset.yaml <<'PY' >reports/semgrep-ruleset.json
          import hashlib, json, os, sys, yaml
          def sha(b): return hashlib.sha256(b).hexdigest()
          def canon(o): return json.dumps(o, sort_keys=True, separators=(",", ":")).encode()
          data = open(sys.argv[1], "rb").read()
          rules = yaml.safe_load(data)["rules"]
          per_rule = {r["id"]: sha(canon(r)) for r in rules}
          assert len(per_rule) == len(rules), "duplicate rule ids"
          json.dump({"ruleset": os.environ["SEMGREP_RULESET"], "rule_count": len(rules),
                     "sha256_canonical": sha(canon(per_rule)), "sha256_raw": sha(data),
                     "rule_sha256": dict(sorted(per_rule.items()))}, sys.stdout, indent=1)
          PY
          jq -r '"\(.ruleset): \(.rule_count) rules, canonical sha256 \(.sha256_canonical) (raw \(.sha256_raw))"' \
            reports/semgrep-ruleset.json

      # Without --error Semgrep exits 0 with findings; any other code is a tool failure (T5).
      # Semgrep prefixes rule ids with the directory of a local config file, so the registry
      # ruleset sits in the workspace root (plain registry ids, as in gate-exceptions.yaml) and the
      # custom rules get the stable prefix "semgrep-rules.". The ruleset file is outside app/ and
      # outside reports/, so it is neither scanned nor uploaded.
      - name: Semgrep (JSON for M1, SARIF for code scanning)
        run: |
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan \
            --config registry-ruleset.yaml --config semgrep-rules/ \
            --metrics=off --disable-version-check --disable-nosem \
            --exclude app/tests \
            --json-output reports/semgrep.json --sarif-output reports/semgrep.sarif \
            --quiet app/ >/dev/null

      # --exit-zero: findings do not fail this step, so a non-zero code is a tool failure (T5).
      - name: Bandit (JSON for M1, SARIF for code scanning)
        run: |
          for format in json sarif; do
            "$RUNNER_TEMP/bandit/bin/bandit" --recursive app/ --exclude app/tests \
              --ignore-nosec --exit-zero --quiet --format "$format" --output "reports/bandit.$format"
          done

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sast-reports
          path: reports/
          if-no-files-found: error
          retention-days: 90

      - name: Upload Semgrep SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('reports/semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/semgrep.sarif
          category: semgrep

      - name: Upload Bandit SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('reports/bandit.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/bandit.sarif
          category: bandit

      - name: Gate - Semgrep all but INFO, Bandit confidence MEDIUM+
        run: |
          "$RUNNER_TEMP/bandit/bin/python" .github/scripts/sast_gate.py \
            --semgrep reports/semgrep.json --bandit reports/bandit.json \
            --exceptions .github/gate-exceptions.yaml

  # B10, B11: SCA on the runtime dependencies of the application (ADR-0046). pip-audit with the
  # OSV database (Z1) on app/requirements.txt, the --no-dev export of uv.lock (Z4), and the
  # consistency of pyproject.toml, uv.lock and requirements.txt (ADR-0008, ADR-0041). Tools from
  # PyPI with hashes (D9), run in the Python image of the application (Z3, Z5). JSON report only:
  # pip-audit has no SARIF, vulnerable dependencies reach the Security tab as Dependabot alerts (Z2).
  sca:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull tool image
        run: docker pull --quiet "$PYTHON_IMAGE"

      # The venv lives in $RUNNER_TEMP/sca, so later containers of the same image reuse it.
      - name: Install tools (hash-checked)
        id: install
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/sca:/tools" "$PYTHON_IMAGE" sh -euc '
            python -m venv /tools/venv
            /tools/venv/bin/pip install --quiet --disable-pip-version-check --no-deps \
              --require-hashes -r /repo/.github/tools/sca.txt
            python --version
            /tools/venv/bin/pip-audit --version
            /tools/venv/bin/uv --version'

      # B11: uv.lock is up to date with pyproject.toml (uv lock --check), and requirements.txt is
      # the export of uv.lock made with the command in its header. Both checks run on a copy of
      # app/, so the workspace stays read-only; the export diff is kept in the reports.
      - name: Lockfile consistency (pyproject.toml, uv.lock, requirements.txt)
        run: |
          docker run --rm -v "$PWD:/repo:ro" -v "$PWD/reports:/reports" -v "$RUNNER_TEMP/sca:/tools" \
            -e UV_CACHE_DIR=/tmp/uv-cache -e UV_PYTHON_DOWNLOADS=never "$PYTHON_IMAGE" sh -euc '
            cp -r /repo/app /tmp/app
            cd /tmp/app
            /tools/venv/bin/uv lock --check || {
              echo "::error file=app/uv.lock::uv.lock is out of date with pyproject.toml (run uv lock)"
              exit 1
            }
            /tools/venv/bin/uv export --format requirements-txt --no-dev --frozen --quiet -o requirements.txt
            if diff -u /repo/app/requirements.txt requirements.txt >/reports/requirements-export.diff; then
              echo "app/requirements.txt matches the export of uv.lock"
            else
              cat /reports/requirements-export.diff
              echo "::error file=app/requirements.txt::not the export of uv.lock (see app/README.md)"
              exit 1
            fi'

      # B10: pip-audit exits 1 both on findings and on errors, and writes the report only when the
      # audit completes, so the report tells them apart (the gate below fails closed). Up to three
      # attempts when the OSV API does not answer (Z8); a report from an earlier attempt is removed.
      - name: pip-audit (JSON for M1)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          for attempt in 1 2 3; do
            rm -f reports/pip-audit.json
            docker run --rm -v "$PWD:/repo:ro" -v "$PWD/reports:/reports" -v "$RUNNER_TEMP/sca:/tools" \
              "$PYTHON_IMAGE" /tools/venv/bin/pip-audit \
              --requirement /repo/app/requirements.txt --disable-pip --strict \
              --vulnerability-service osv --aliases on --desc on --progress-spinner off \
              --format json --output /reports/pip-audit.json || true
            if [ -s reports/pip-audit.json ]; then
              echo "pip-audit report written (attempt $attempt)"
              exit 0
            fi
            echo "::warning::pip-audit attempt $attempt wrote no report"
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          echo "::error::pip-audit wrote no report after 3 attempts"
          exit 1

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sca-reports
          path: reports/
          if-no-files-found: error
          retention-days: 90

      - name: Gate - pip-audit (any known vulnerability)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/sca:/tools" -w /repo \
            -v "$GITHUB_STEP_SUMMARY:/step-summary" -e GITHUB_STEP_SUMMARY=/step-summary \
            "$PYTHON_IMAGE" /tools/venv/bin/python .github/scripts/sca_gate.py \
            --pip-audit reports/pip-audit.json --path app/requirements.txt \
            --exceptions .github/gate-exceptions.yaml

  # B13, B14, B15: IaC scan (ADR-0047). Checkov and Trivy config on both Terraform layers
  # (infra/terraform/work, infra/terraform/shared) and app/Dockerfile (I1); hadolint on
  # app/Dockerfile. Checkov from PyPI with hashes, Trivy and hadolint from images by digest (D9).
  # Full JSON and SARIF reports first, then the gate (iac_gate.py) applies the thresholds of
  # ADR-0042 (D5, D5a, D7), the exceptions of gate-exceptions.yaml (D6), and blocks in-code
  # suppressions (D13, I3) and scanner configuration files (I4).
  iac:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload-sarif (I5)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools (hash-checked)
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/checkov"
          "$RUNNER_TEMP/checkov/bin/pip" install --quiet --no-deps --require-hashes -r .github/tools/iac.txt
          "$RUNNER_TEMP/checkov/bin/checkov" --version

      - name: Pull tool images
        run: |
          docker pull --quiet "$TRIVY_IMAGE"
          docker pull --quiet "$HADOLINT_IMAGE"

      # One run for both targets: -d infra/terraform covers both layers, -d app finds the
      # Dockerfile (the dockerfile framework only). --skip-download and --skip-results-upload: no
      # calls to the Prisma Cloud platform. No --quiet: the JSON report keeps passed and skipped
      # checks (M1, D13). Exit code 1 means failed checks and is expected; 2 is a tool error.
      - name: Checkov (JSON for M1, SARIF for code scanning)
        run: |
          mkdir -p reports
          "$RUNNER_TEMP/checkov/bin/checkov" -d infra/terraform -d app --framework terraform dockerfile \
            --skip-download --skip-results-upload -o json -o sarif \
            --output-file-path "$RUNNER_TEMP/checkov-out" >/dev/null || [ $? -eq 1 ]
          mv "$RUNNER_TEMP/checkov-out/results_json.json" reports/checkov.json
          mv "$RUNNER_TEMP/checkov-out/results_sarif.sarif" reports/checkov.sarif

      # Trivy takes one target, so it scans a copy of the tracked IaC files kept at their repository
      # paths: one report with repository-relative paths. Scanning the parent directory of the two
      # layers in a working copy also picks up local .terraform/ directories; tracked files only
      # avoid that. --config "" and --ignorefile "": no trivy.yaml or .trivyignore (I4).
      # --skip-check-update: checks built into the pinned binary. Default exit code 0, so a
      # non-zero code is a tool error.
      - name: Trivy config (JSON for M1, SARIF for code scanning)
        run: |
          tree="$RUNNER_TEMP/iac-tree"
          mkdir -p "$tree"
          git ls-files -z infra/terraform app/Dockerfile | xargs -0 cp --parents -t "$tree"
          for format in json sarif; do
            docker run --rm -v "$tree:/scan:ro" -v "$PWD/reports:/reports" "$TRIVY_IMAGE" config \
              --quiet --skip-check-update --skip-version-check --config "" --ignorefile "" \
              --format "$format" --output "/reports/trivy-config.$format" /scan
          done

      # --no-fail: the report is written with any finding, so a non-zero code is a tool error.
      # --disable-ignore-pragma: `# hadolint ignore=` comments are ignored (D13).
      - name: hadolint (JSON for M1, SARIF for code scanning)
        run: |
          for format in json sarif; do
            docker run --rm -v "$PWD:/repo:ro" -w /repo "$HADOLINT_IMAGE" hadolint \
              --disable-ignore-pragma --no-fail --no-color -f "$format" app/Dockerfile \
              >"reports/hadolint.$format"
          done

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iac-reports
          path: reports/
          if-no-files-found: error
          retention-days: 90

      - name: Upload Checkov SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('reports/checkov.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/checkov.sarif
          category: checkov

      - name: Upload Trivy config SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('reports/trivy-config.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/trivy-config.sarif
          category: trivy-config

      - name: Upload hadolint SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('reports/hadolint.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/hadolint.sarif
          category: hadolint

      - name: Gate - Checkov any, Trivy LOW+, hadolint error
        run: |
          "$RUNNER_TEMP/checkov/bin/python" .github/scripts/iac_gate.py \
            --checkov reports/checkov.json --trivy reports/trivy-config.json \
            --hadolint reports/hadolint.json --exceptions .github/gate-exceptions.yaml \
            --scan-path infra/terraform --scan-path app/Dockerfile


  # Build of variant A (ADR-0036, ADR-0040) with the image scan of ADR-0048 between docker build
  # and docker push (ADR-0042, D1): a blocked image never reaches GHCR. Pull requests only build
  # and scan; a push also publishes <branch>-sha-<commit> and the branch tag, as in variant A.
  # The tag moves before `attest` ends; the instance deploys a digest only with a verified
  # attestation, and waits until then (D3, ADR-0050). No id-token permission here: build steps
  # cannot sign provenance (SLSA Build L3 recipe, docs/notes/slsa.md 3.3).
  # Trivy reads the image from a docker save archive (--input), with no access to the Docker
  # daemon (M5), against a vulnerability database pinned by digest (M3). Full JSON report first,
  # SARIF converted from it, then the gate (image_gate.py): MEDIUM+ with a fix and any secret
  # block (D5a, M4), exceptions only from gate-exceptions.yaml (D6, M2).
  build:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # used only on push: the login and push steps are skipped for pull requests
      security-events: write # upload-sarif
    # Same group as rollback.yml: a publication and a rollback never move the branch tag at once.
    concurrency:
      group: deploy-tag-${{ github.ref_name }}
      cancel-in-progress: false
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull tool images
        run: |
          docker pull --quiet "$TRIVY_IMAGE"
          docker pull --quiet "$PYTHON_IMAGE"

      - name: Build image
        run: |
          set -euo pipefail
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          tag=${GITHUB_REF_NAME//\//-}
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:$tag-sha-$GITHUB_SHA" --tag "$image:$tag" app/
          docker save --output "$RUNNER_TEMP/image.tar" "$image:$tag-sha-$GITHUB_SHA"
          {
            echo "IMAGE=$image"
            echo "BRANCH_TAG=$tag"
            echo "SHA_TAG=$tag-sha-$GITHUB_SHA"
          } >>"$GITHUB_ENV"

      # The archive goes to the sbom job (ADR-0049, S5) before the scan and the gate, so the SBOM
      # is also made when the gate blocks the image; later also to dast (D2).
      - name: Upload image archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-archive
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 1

      # Fail closed (M3a): if the pinned database cannot be downloaded, the job fails; a new
      # digest is set on purpose, together with a review of the exceptions.
      - name: Download vulnerability database (pinned)
        run: |
          set -euo pipefail
          mkdir -p reports "$RUNNER_TEMP/trivy-cache"
          docker run --rm -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" "$TRIVY_IMAGE" image \
            --download-db-only --db-repository "$TRIVY_DB_REPOSITORY" \
            --quiet --no-progress --skip-version-check
          jq --arg repo "$TRIVY_DB_REPOSITORY" '. + {Repository: $repo}' \
            "$RUNNER_TEMP/trivy-cache/db/metadata.json" >reports/trivy-db.json
          cat reports/trivy-db.json

      # --skip-db-update: only the pinned database. --config "", --ignorefile "" and
      # --secret-config "": no trivy.yaml, .trivyignore or secret rule file (as I4).
      # Default exit code 0, so a non-zero code is a tool error.
      - name: Trivy image (JSON for M1, SARIF for code scanning)
        run: |
          set -euo pipefail
          docker run --rm -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            -v "$RUNNER_TEMP/image.tar:/image.tar:ro" -v "$PWD/reports:/reports" "$TRIVY_IMAGE" image \
            --input /image.tar --skip-db-update --scanners vuln,secret --image-config-scanners secret \
            --config "" --ignorefile "" --secret-config "" \
            --quiet --skip-version-check --disable-telemetry \
            --format json --output /reports/trivy-image.json
          docker run --rm -v "$PWD/reports:/reports" "$TRIVY_IMAGE" convert \
            --quiet --format sarif --output /reports/trivy-image.sarif /reports/trivy-image.json

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-scan-reports
          path: reports/
          if-no-files-found: error
          retention-days: 90

      - name: Upload Trivy image SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('reports/trivy-image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/trivy-image.sarif
          category: trivy-image

      - name: Gate - Trivy image MEDIUM+ with a fix, any secret
        run: |
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/image-gate:/tools" -w /repo \
            -v "$GITHUB_STEP_SUMMARY:/step-summary" -e GITHUB_STEP_SUMMARY=/step-summary \
            "$PYTHON_IMAGE" sh -euc '
            python -m venv /tools/venv
            /tools/venv/bin/pip install --quiet --disable-pip-version-check --no-deps \
              --require-hashes -r .github/tools/image.txt
            /tools/venv/bin/python .github/scripts/image_gate.py \
              --trivy reports/trivy-image.json --db-metadata reports/trivy-db.json \
              --exceptions .github/gate-exceptions.yaml'

      - name: Log in to GHCR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        id: push
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          docker push "$IMAGE:$SHA_TAG"
          docker push "$IMAGE:$BRANCH_TAG"
          digest=$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$IMAGE:$SHA_TAG")
          digest=${digest#*@}
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest after push: $digest"; exit 1; }
          echo "image=$IMAGE" >>"$GITHUB_OUTPUT"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          {
            echo "### Published image"
            echo "- \`$IMAGE:$SHA_TAG\`"
            echo "- \`$IMAGE:$BRANCH_TAG\`"
            echo "- digest \`$digest\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Log out of GHCR
        if: always() && github.event_name == 'push'
        run: docker logout ghcr.io

  # B22: SBOM (ADR-0049). Syft reads the docker save archive of the image built (and on a push
  # published) by `build` (S5), on pull requests and pushes (S2), and writes SPDX JSON and
  # CycloneDX JSON in one run; SPDX is attested by `attest` (ADR-0050, B2).
  # Fail closed without a severity threshold (S3): an error of Syft, a missing file, another
  # schema version, an SBOM without OS or Python packages, or an image from another commit fail
  # the job. Runs also when the image gate blocks, as long as the archive was uploaded.
  sbom:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download image archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-archive
          path: ${{ runner.temp }}/image

      - name: Pull tool images
        run: |
          docker pull --quiet "$SYFT_IMAGE"
          docker pull --quiet "$PYTHON_IMAGE"

      # --source-name: the image name in GHCR instead of the archive path. No --source-version:
      # it would replace the image digest in the CycloneDX document; the commit is checked from
      # the image label instead. No update check (pinned version).
      - name: Syft (SPDX JSON, CycloneDX JSON)
        run: |
          set -euo pipefail
          mkdir -p sbom
          docker run --rm -e SYFT_CHECK_FOR_APP_UPDATE=false \
            -v "$RUNNER_TEMP/image:/in:ro" -v "$PWD/sbom:/out" "$SYFT_IMAGE" \
            docker-archive:/in/image.tar \
            --source-name "ghcr.io/${GITHUB_REPOSITORY,,}" \
            --output spdx-json=/out/sbom.spdx.json --output cyclonedx-json=/out/sbom.cdx.json \
            --quiet

      - name: Upload SBOM
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error
          retention-days: 90

      - name: Check SBOM (files, schema, content, commit)
        run: |
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/image:/in:ro" -w /repo \
            -v "$GITHUB_STEP_SUMMARY:/step-summary" -e GITHUB_STEP_SUMMARY=/step-summary \
            "$PYTHON_IMAGE" python -I .github/scripts/sbom_check.py \
            --spdx sbom/sbom.spdx.json --cyclonedx sbom/sbom.cdx.json \
            --archive /in/image.tar --revision "$GITHUB_SHA"

  # B23: attestations (ADR-0050). Push only: on a pull request no image reaches the registry.
  # Runs after every job of this run (D3); the reusable workflow is the signer identity that the
  # instance checks (--signer-workflow, A3). The digest is the `build` output, not a tag.
  attest:
    needs: [lint, test, secrets, sast, sca, iac, build, sbom]
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    uses: ./.github/workflows/attest.yml
    with:
      image: ${{ needs.build.outputs.image }}
      digest: ${{ needs.build.outputs.digest }}

  # B24 in CI (ADR-0050, B3): the check of the instance, with the same script
  # (infra/terraform/work/verify-attestation.sh) and the same gh tarball, with no GitHub token
  # and no registry login. Enforcement stays on the instance; this job reports early and keeps
  # the negative test of E07-09 repeatable without AWS. Expected exit codes of the script:
  # 0 verified, 10 no attestation, 11 attestation rejected.
  verify:
    needs: [build, attest]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # An image of main published by variant A before E07-09 (commit 060ea70), so it has no
      # attestation: the "no attestation yet" case.
      UNATTESTED_DIGEST: sha256:4b68b453d0f4c572014b171daa2561ea47aac3aa77e6ac9739337996028ae50a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gh (pinned tarball, as on the instance)
        run: |
          set -euo pipefail
          curl -fsSL --max-time 120 -o "$RUNNER_TEMP/gh.tar.gz" \
            "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "$GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin/gh" --version

      # Each case runs with an empty HOME (no gh or Docker credentials, fresh TUF cache) and
      # without GitHub tokens, like the deploy agent. A case passes only with its expected code.
      - name: Verify the attestation (positive and negative cases)
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          OWNER_REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -uo pipefail
          gh_bin=$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin/gh
          check=infra/terraform/work/verify-attestation.sh
          failures=0
          run_case() { # <name> <expected code> <digest> <source ref> <signer workflow>
            local home rc=0
            home=$(mktemp -d)
            # `|| rc=$?`: the step shell runs with -e, and a non-zero code is an expected result here.
            env -i PATH="$PATH" HOME="$home" GH="$gh_bin" GH_NO_UPDATE_NOTIFIER=1 GH_PROMPT_DISABLED=1 \
              SOURCE_REPOSITORY="$OWNER_REPO" SOURCE_REF="$4" SIGNER_WORKFLOW="$5" \
              bash "$check" "$IMAGE" "$3" || rc=$?
            if [[ $rc == "$2" ]]; then result=PASS; else result=FAIL; failures=$((failures + 1)); fi
            echo "$1: exit $rc, expected $2: $result"
            echo "| $1 | $2 | $rc | $result |" >>"$GITHUB_STEP_SUMMARY"
          }
          signer=$OWNER_REPO/.github/workflows/attest.yml
          {
            echo "### Attestation check (verify-attestation.sh, gh $GH_VERSION)"
            echo "- image: \`$IMAGE@$DIGEST\`"
            echo
            echo "| Case | Expected | Exit | Result |"
            echo "|---|---|---|---|"
          } >>"$GITHUB_STEP_SUMMARY"
          run_case "attested image, expected signer and ref" 0 "$DIGEST" "$REF" "$signer"
          run_case "signer is not attest.yml" 11 "$DIGEST" "$REF" "$OWNER_REPO/.github/workflows/devsecops-ci.yml"
          run_case "another source ref" 11 "$DIGEST" "refs/heads/not-$GITHUB_REF_NAME" "$signer"
          run_case "image without attestation" 10 "$UNATTESTED_DIGEST" "$REF" "$signer"
          if ((failures)); then
            echo "::error::$failures attestation case(s) did not give the expected result"
            exit 1
          fi
