# Baseline CI (variant A, experiment/PROTOCOL.md): lint, tests and image build/publication,
# no security controls. Variant B adds its security jobs next to these; the shared jobs stay
# identical (K2).
#
# Decisions: docs/adr/0035-workflow-ci-lint-i-testy.md (lint, test),
# docs/adr/0036-build-i-publikacja-obrazu.md (build)
# - uv from astral-sh/setup-uv, same uv version as app/Dockerfile, Python from app/.python-version;
# - no dependency cache: pipeline time is an experiment metric (E06-04);
# - PostgreSQL from app/compose.yaml with a generated app/.env (ADR-0023), not `services:`.
name: baseline-ci

on:
  pull_request:
    branches: [main, "exp/variant-*"]
  push:
    branches: [main, "exp/variant-*"]

permissions: {}

# One run per ref at a time; queued, not cancelled, so no run is lost from the timing data.
concurrency:
  group: baseline-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.6"
  # sha256 of uv-x86_64-unknown-linux-gnu.tar.gz 0.13.6 (GitHub release asset)
  UV_CHECKSUM: f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          working-directory: app
          enable-cache: "false"

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .

      - name: ruff format
        run: uv run --no-sync ruff format --check .

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          working-directory: app
          enable-cache: "false"

      - name: Generate app/.env with random secrets
        run: sh scripts/ci-env.sh

      - name: Start PostgreSQL
        run: docker compose up -d --wait db

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: pytest
        run: uv run --no-sync pytest

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down --volumes

  # Decisions: docs/adr/0036-build-i-publikacja-obrazu.md, docs/adr/0040-tag-sha-z-nazwa-galezi.md
  # Pull requests only build the image; a push to main or exp/variant-* also publishes it to
  # GHCR as <branch>-sha-<commit> and as the branch tag. The SHA tag carries the branch because
  # the same commit built on two branches gives two different digests (ADR-0040).
  # The deploy agent on the instance follows the branch tag and needs the revision label
  # (docs/adr/0033-mechanizm-wdrozenia-pull.md).
  build:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # used only on push: the login and push steps are skipped for pull requests
    # Same group as rollback.yml: a publication and a rollback never move the branch tag at once.
    concurrency:
      group: deploy-tag-${{ github.ref_name }}
      cancel-in-progress: false
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: |
          set -euo pipefail
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          tag=${GITHUB_REF_NAME//\//-}
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:$tag-sha-$GITHUB_SHA" --tag "$image:$tag" app/
          echo "IMAGE=$image" >>"$GITHUB_ENV"
          echo "BRANCH_TAG=$tag" >>"$GITHUB_ENV"
          echo "SHA_TAG=$tag-sha-$GITHUB_SHA" >>"$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        id: push
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          docker push "$IMAGE:$SHA_TAG"
          docker push "$IMAGE:$BRANCH_TAG"
          digest=$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$IMAGE:$SHA_TAG")
          digest=${digest#*@}
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest after push: $digest"; exit 1; }
          echo "image=$IMAGE" >>"$GITHUB_OUTPUT"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          {
            echo "### Published image"
            echo "- \`$IMAGE:$SHA_TAG\`"
            echo "- \`$IMAGE:$BRANCH_TAG\`"
            echo "- digest \`$digest\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Log out of GHCR
        if: always() && github.event_name == 'push'
        run: docker logout ghcr.io
