# Attestations of the published image (variant B, B23; docs/adr/0050-atestacje-i-weryfikacja-przed-wdrozeniem.md).
#
# Reusable workflow called by the `attest` job of devsecops-ci.yml, after all gates of the run
# (ADR-0042, D3). It is the signer identity of the attestations: the instance and the `verify`
# job accept only attestations signed by this file (gh --signer-workflow). The calling jobs,
# including `build`, have no id-token permission, so build steps cannot sign provenance
# (SLSA Build L3 recipe, docs/notes/slsa.md 3.3; BUILD-3* of NIST SP 800-204D).
#
# Two attestations, both pushed to GHCR next to the image (A2, B2):
# - SLSA build provenance, generated by actions/attest from the OIDC claims of this run,
# - SBOM (SPDX 2.3 from the `sbom` job of the same run, ADR-0049).
# The digest comes from the `build` job output, not from a tag, so a moved tag cannot change the
# subject. No workflow_dispatch inputs and no vars influence the build (SLSA completeness).
name: attest

on:
  workflow_call:
    inputs:
      image:
        description: Image repository in GHCR without a tag (ghcr.io/owner/repo)
        type: string
        required: true
      digest:
        description: Digest of the image published by `build` (sha256:...)
        type: string
        required: true

permissions: {}

jobs:
  attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate (Fulcio) for the attestations
      attestations: write # store the attestations in the repository
      packages: write # push the attestation bundles to GHCR
    steps:
      - name: Check inputs
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          expected=ghcr.io/${GITHUB_REPOSITORY,,}
          [[ $IMAGE == "$expected" ]] || { echo "::error::image $IMAGE is not $expected"; exit 1; }
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::invalid digest: $DIGEST"; exit 1; }

      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom

      # actions/attest reads the registry credentials from the Docker configuration.
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Storage records are only available for organization-owned repositories.
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ inputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest SBOM (SPDX)
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ inputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom/sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

      - name: Summary
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          SBOM_URL: ${{ steps.sbom.outputs.attestation-url }}
        run: |
          {
            echo "### Attestations"
            echo "- subject: \`$IMAGE@$DIGEST\`"
            echo "- provenance: $PROVENANCE_URL"
            echo "- SBOM (SPDX): $SBOM_URL"
          } >>"$GITHUB_STEP_SUMMARY"
