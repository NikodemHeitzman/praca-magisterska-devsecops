# NEGATIVE TEST (E07-02), do not merge: third-party action pinned by SHA but not on the allow list.
name: neg-not-allowed
on:
  pull_request:
permissions: {}
jobs:
  not-allowed:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
